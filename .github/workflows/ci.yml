name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate commands, events & services load
        run: npm run validate

      - name: Syntax-check all source files
        run: node --check src/index.js && find src scripts -name '*.js' -exec node --check {} +
